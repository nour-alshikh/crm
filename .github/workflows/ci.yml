name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # Real env vars win over .env (Dotenv is immutable); phpunit.xml sets
      # DB_DATABASE=testing. Root is needed: --parallel creates testing_test_N.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, redis, gd, intl, bcmath, zip, exif, pcntl
          coverage: pcov
          tools: composer:v2

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      # --min is a ratchet, not the 80% target: template example code is still
      # untested (ADR-031). Raise it as coverage grows; never lower it.
      - name: Tests (Pest, parallel, coverage)
        run: php artisan test --parallel --coverage --min=40

      - name: Security audit (Composer)
        run: composer audit --no-dev

      # Fails when routes/requests/resources changed without re-exporting the
      # spec. Fix locally: ./sail composer api:spec && (cd ../frontend && npm run api:types)
      - name: OpenAPI spec is up to date
        # Scramble reads the DB schema to type model attributes, so export
        # against a migrated database, like the local `crm` one.
        env:
          DB_DATABASE: testing
        run: |
          php artisan migrate:fresh --force --no-interaction
          php artisan scramble:export --path=openapi.json
          git diff --exit-code -- openapi.json

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated API types match the spec
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Security audit (npm, informational)
        run: npm audit --omit=dev || true

  e2e:
    name: E2E
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: crm
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: crm
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      MAIL_MAILER: log
      PHP_CLI_SERVER_WORKERS: 4
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, redis, gd, intl, bcmath, zip, exif
          coverage: none
          tools: composer:v2

      - name: Composer cache dir
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # The PHP runtime runs directly on the runner (services for MySQL/Redis)
      # instead of building the Sail image, which takes minutes per run (ADR-031).
      - name: Start API (migrated + seeded)
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed --force
          php artisan storage:link
          nohup php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/up > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend + browser
        working-directory: frontend
        run: |
          npm ci
          cp .env.example .env.local
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend
        env:
          E2E_BACKEND: "1"
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: API log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

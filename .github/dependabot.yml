version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
